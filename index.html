<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photography Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('your-background-image.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }

        .gallery {
            padding: 50px 10%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s;
        }

            /* Make gallery images clickable and add a lightbox overlay */
            .gallery img { cursor: pointer; }

            .lightbox-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.9);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 2000;
                padding: 20px;
            }

            .lightbox-overlay.active { display: flex; }

            .lightbox-content {
                max-width: 95vw;
                max-height: 95vh;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
            }

            .lightbox-img {
                max-width: 100%;
                max-height: 100%;
                border-radius: 8px;
                box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            }

            .lightbox-close, .lightbox-prev, .lightbox-next {
                position: absolute;
                background: rgba(0,0,0,0.5);
                color: #fff;
                border: none;
                padding: 10px 12px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 18px;
            }

            .lightbox-close { top: 12px; right: 12px; }
            .lightbox-prev { left: 12px; top: 50%; transform: translateY(-50%); }
            .lightbox-next { right: 12px; top: 50%; transform: translateY(-50%); }

        .gallery img:hover {
            transform: scale(1.05);
        }

        nav {
            position: fixed;
            width: 100%;
            padding: 20px;
            background: rgba(0,0,0,0.8);
            z-index: 10;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
        }

        /* Chat widget styles */
        .chat-widget {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 1000;
            font-family: inherit;
        }

        .chat-toggle {
            background: #0066ff;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.2);
        }

        .chat-panel {
            width: 340px;
            max-width: calc(100vw - 40px);
            height: 480px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Ensure the chat panel shows/hides reliably with a class on the widget */
        .chat-widget .chat-panel { display: none; }
        .chat-widget.open .chat-panel { display: flex; }
        .chat-widget .chat-toggle { display: inline-block; }
        .chat-widget.open .chat-toggle { background: #ff3333; }

        .chat-header {
            background: #0f172a;
            color: white;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .chat-messages {
            padding: 12px;
            flex: 1 1 auto;
            overflow-y: auto;
            background: linear-gradient(180deg,#f7f7fb,#fff);
        }

        .chat-message {
            margin: 8px 0;
            padding: 10px 12px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.3;
        }

        .chat-message.user {
            background: #e6f0ff;
            align-self: flex-end;
        }

        .chat-message.assistant {
            background: #f1f1f5;
            align-self: flex-start;
        }

        .chat-form {
            display: flex;
            gap: 8px;
            padding: 10px;
            border-top: 1px solid #eee;
            background: white;
        }

        .chat-form input[type="text"] {
            flex: 1 1 auto;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .chat-form button[type="submit"] {
            background: #0066ff;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .chat-panel { height: 60vh; width: 92vw; }
        }
        /* Casino theme: black & red accents */
        .casino { background: #0b0b0b; color: #f7f7f7; }
        .casino h2, .casino h3 { color: #ff3333; }
        .casino .casino-grid > div { background: #111; border: 1px solid #330000; color: #fff; }
        .casino .slot-reels { background: #060606; padding: 10px; border-radius: 8px; }
        .casino .slot-reels .reel { display:flex;align-items:center;justify-content:center;width:72px;height:72px;background:#111;border-radius:8px;font-size:40px; }
        .casino .slot-reels .reel.spinning { animation: reel-spin 0.18s linear infinite; transform-origin:center; }
        @keyframes reel-spin {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.05); }
            100% { transform: translateY(0) scale(1); }
        }
        .casino input[type="number"] { background:#111;color:#ff3333;border:1px solid #333 }
        /* Make credit & score numbers red for casino theme */
        .casino #slotCredits, .casino #bjCredits, .casino #playerScore, .casino #dealerScore, .casino #slotResult {
            color: #ff3333; font-weight:700;
        }
        /* Make bet inputs/text red */
        .casino #slotBet, .casino #bjBet { color: #ff3333; font-weight:700 }
        .casino button { background: #b30000; color: #ff3333; border: none; cursor: pointer; }
        .casino button[disabled] { opacity: 0.5; cursor: not-allowed }
        .casino .slot-result { color:#ffd700; font-weight:700 }
    </style>
</head>
